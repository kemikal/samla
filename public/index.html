<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samla</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Samla</h1>

    <section id="join">
      <input id="code" placeholder="Rumskod" autocomplete="off" inputmode="numeric">
      <input id="name" placeholder="Ditt namn" autocomplete="off">
      <button id="joinBtn">Gå med</button>
      <p id="error" class="muted"></p>
    </section>

    <section id="wait" class="hidden">
      <p class="muted">Du är med! Väntar på att spelet startar…</p>
    </section>

    <section id="question" class="hidden">
      <p id="qText"></p>
      <div id="options" class="options"></div>
    </section>

    <section id="result" class="hidden">
      <p id="resultText"></p>
    </section>

    <footer class="muted">
      <a href="/login">Skapa ny omröstning</a>
    </footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const show = (id) => {
      for (const s of document.querySelectorAll("main > section")) s.classList.add("hidden");
      $(id).classList.remove("hidden");
    };
    let code = null;
    let name = null;
    let playerId = null;
    let myAnswer = null;

    // Sessionen sparas så att sidladdning och återanslutning på mobilen fungerar
    const saved = JSON.parse(sessionStorage.getItem("samla") ?? "null");
    const urlCode = new URLSearchParams(location.search).get("code");
    if (urlCode) {
      $("code").value = urlCode;
      $("code").classList.add("hidden");
    }

    let qType = "choice";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function renderQuestion({ index, total, type, text, options }) {
      $("qText").textContent = `${index + 1}/${total}: ${text}`;
      qType = type ?? "choice";
      $("options").className = qType === "text" ? "" : "options";
      $("options").innerHTML = qType === "text"
        ? `<form class="answerForm" id="answerForm">
             <input id="answerInput" placeholder="Skriv 1–3 ord" maxlength="40" autocomplete="off" autofocus>
             <button type="submit">Svara</button>
           </form>
           <p id="answerMsg" class="muted"></p>`
        : options.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join("");
      show("question");
    }

    // Låser svaret: markerar valt alternativ, eller visar det skrivna svaret
    function lockAnswer(answer) {
      if (qType === "text") {
        $("answerInput").value = answer;
        $("answerInput").disabled = true;
        $("answerForm").querySelector("button").disabled = true;
        $("answerMsg").textContent = "Ditt svar är skickat. Väntar på resultatet…";
        return;
      }
      for (const b of $("options").querySelectorAll("button")) b.disabled = true;
      const btn = $("options").querySelector(`button[data-i="${answer}"]`);
      if (btn) btn.style.outline = "4px solid var(--fg)";
    }

    function join(payload) {
      $("error").textContent = "";
      socket.emit("player:join", payload, (res) => {
        if (res.error) {
          sessionStorage.removeItem("samla");
          $("error").textContent = res.error;
          return show("join");
        }
        code = payload.code;
        name = res.name;
        playerId = res.playerId;
        sessionStorage.setItem("samla", JSON.stringify({ code, name, playerId }));
        if (res.state.phase === "question") {
          renderQuestion(res.state.question);
          myAnswer = res.state.answer;
          if (myAnswer !== null) lockAnswer(myAnswer);
        } else {
          show("wait");
        }
      });
    }

    $("joinBtn").onclick = () => join({ code: $("code").value.trim(), name: $("name").value });

    socket.on("connect", () => {
      // Första laddningen med sparad session, eller återanslutning efter tappad förbindelse
      const s = playerId ? { code, name, playerId } : saved;
      if (s && (!urlCode || s.code === urlCode)) join(s);
    });
    // OBS: får inte returnera false, då blockeras tangenttryckningen (buggen från lektionen)
    $("name").onkeydown = (e) => { if (e.key === "Enter") $("joinBtn").click(); };

    socket.on("game:question", (q) => {
      myAnswer = null;
      renderQuestion(q);
    });

    $("options").onclick = (e) => {
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      myAnswer = Number(btn.dataset.i);
      socket.emit("player:answer", { code, option: myAnswer });
      lockAnswer(myAnswer);
    };

    // Fritext: servern städar svaret och säger ifrån om det är för långt
    $("options").onsubmit = (e) => {
      e.preventDefault();
      const text = $("answerInput").value.trim();
      if (!text) return;
      socket.emit("player:answer", { code, text }, (res) => {
        if (res.error) return ($("answerMsg").textContent = res.error);
        myAnswer = res.answer;
        lockAnswer(myAnswer);
      });
    };

    socket.on("game:results", ({ correct, scored, leaderboard }) => {
      if (correct === null) {
        $("resultText").textContent = myAnswer === null ? "Du hann inte svara. Väntar på nästa fråga…" : "Tack för ditt svar! Väntar på nästa fråga…";
        return show("result");
      }
      const me = leaderboard.find((p) => p.name === name);
      const place = leaderboard.findIndex((p) => p.name === name) + 1;
      const verdict = myAnswer === null ? "Du svarade inte" : myAnswer === correct ? "Rätt!" : "Fel";
      $("resultText").textContent = `${verdict} – ${me?.score ?? 0} poäng, plats ${place} av ${leaderboard.length}`;
      show("result");
    });

    socket.on("game:over", ({ scored, leaderboard }) => {
      const me = leaderboard.find((p) => p.name === name);
      const place = leaderboard.findIndex((p) => p.name === name) + 1;
      $("resultText").textContent = scored
        ? `Spelet är slut! Du kom på plats ${place} av ${leaderboard.length} med ${me?.score ?? 0} poäng.`
        : "Omröstningen är slut. Tack för att du var med!";
      sessionStorage.removeItem("samla");
      playerId = null;
      show("result");
    });
  </script>
</body>
</html>
