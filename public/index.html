<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samla</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Samla</h1>

    <section id="join">
      <input id="code" placeholder="Rumskod" autocomplete="off" inputmode="numeric">
      <input id="name" placeholder="Ditt namn" autocomplete="off">
      <button id="joinBtn">Gå med</button>
      <p id="error" class="muted"></p>
    </section>

    <section id="wait" class="hidden">
      <p class="muted">Du är med! Väntar på att spelet startar…</p>
    </section>

    <section id="question" class="hidden">
      <p id="qText"></p>
      <div id="options" class="options"></div>
    </section>

    <section id="result" class="hidden">
      <p id="resultText"></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const show = (id) => {
      for (const s of document.querySelectorAll("section")) s.classList.add("hidden");
      $(id).classList.remove("hidden");
    };
    let code = null;
    let name = null;
    let myAnswer = null;

    // Kod från QR-länken (/?code=1234) fyller i fältet och döljer det
    const urlCode = new URLSearchParams(location.search).get("code");
    if (urlCode) {
      $("code").value = urlCode;
      $("code").classList.add("hidden");
      $("name").focus();
    }

    $("joinBtn").onclick = () => {
      $("error").textContent = "";
      socket.emit("player:join", { code: $("code").value, name: $("name").value }, (res) => {
        if (res.error) return ($("error").textContent = res.error);
        code = $("code").value.trim();
        name = $("name").value.trim();
        show("wait");
      });
    };
    $("name").onkeydown = (e) => e.key === "Enter" && $("joinBtn").click();

    socket.on("game:question", ({ index, total, text, options }) => {
      $("qText").textContent = `${index + 1}/${total}: ${text}`;
      $("options").innerHTML = options.map((o, i) => `<button data-i="${i}">${o}</button>`).join("");
      myAnswer = null;
      show("question");
    });

    $("options").onclick = (e) => {
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      myAnswer = Number(btn.dataset.i);
      socket.emit("player:answer", { code, option: myAnswer });
      for (const b of $("options").querySelectorAll("button")) b.disabled = true;
      btn.style.outline = "4px solid var(--fg)";
    };

    socket.on("game:results", ({ correct, leaderboard }) => {
      const me = leaderboard.find((p) => p.name === name);
      const place = leaderboard.findIndex((p) => p.name === name) + 1;
      const verdict = myAnswer === null ? "Du svarade inte" : myAnswer === correct ? "Rätt!" : "Fel";
      $("resultText").textContent = `${verdict} – ${me?.score ?? 0} poäng, plats ${place} av ${leaderboard.length}`;
      show("result");
    });

    socket.on("game:over", ({ leaderboard }) => {
      const me = leaderboard.find((p) => p.name === name);
      const place = leaderboard.findIndex((p) => p.name === name) + 1;
      $("resultText").textContent = `Spelet är slut! Du kom på plats ${place} av ${leaderboard.length} med ${me?.score ?? 0} poäng.`;
      show("result");
    });
  </script>
</body>
</html>
