<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samla – admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
  <main>
    <header class="topRow">
      <h1>Samla <span class="muted">admin</span></h1>
      <p class="muted who"><span id="me"></span> <button class="small" id="logoutBtn">Logga ut</button></p>
    </header>

    <section id="editor">
      <div class="sectionHead">
        <h2>Frågor <span id="qCount" class="muted"></span></h2>
        <div>
          <button id="createBtn">Starta omröstning</button>
          <span id="createError" class="muted"></span>
        </div>
      </div>
      <ol id="qList" class="qList"></ol>

      <form id="qForm" class="card">
        <h3>Ny fråga</h3>
        <label class="field">
          <span>Fråga</span>
          <input name="text" placeholder="T.ex. Vilket protokoll håller förbindelsen öppen?" required autocomplete="off">
        </label>

        <fieldset class="qType">
          <legend>Svarstyp</legend>
          <label><input type="radio" name="type" value="choice" checked> Flerval</label>
          <label><input type="radio" name="type" value="text"> Fritext <span class="muted">(1–3 ord)</span></label>
        </fieldset>

        <p id="textHint" class="muted hidden">Eleverna skriver ett kort svar på högst tre ord. Svaren visas som ett ordmoln där vanliga svar blir större.</p>

        <fieldset class="opts" id="optsFieldset">
          <legend>Svarsalternativ <span class="muted">(2–4 stycken)</span></legend>
          <div class="optHead"><span>Rätt</span><span></span><span>Alternativ</span></div>
          <div class="optRow">
            <input type="radio" name="correct" value="0" aria-label="Alternativ 1 är rätt svar">
            <span class="swatch c0"></span>
            <input name="o0" placeholder="Alternativ 1" required autocomplete="off">
          </div>
          <div class="optRow">
            <input type="radio" name="correct" value="1" aria-label="Alternativ 2 är rätt svar">
            <span class="swatch c1"></span>
            <input name="o1" placeholder="Alternativ 2" required autocomplete="off">
          </div>
          <div class="optRow">
            <input type="radio" name="correct" value="2" aria-label="Alternativ 3 är rätt svar">
            <span class="swatch c2"></span>
            <input name="o2" placeholder="Alternativ 3 (valfritt)" autocomplete="off">
          </div>
          <div class="optRow">
            <input type="radio" name="correct" value="3" aria-label="Alternativ 4 är rätt svar">
            <span class="swatch c3"></span>
            <input name="o3" placeholder="Alternativ 4 (valfritt)" autocomplete="off">
          </div>
          <label class="optRow none">
            <input type="radio" name="correct" value="" checked>
            <span></span>
            <span>Inget rätt svar – ren åsiktsomröstning utan poäng</span>
          </label>
        </fieldset>

        <div class="actions">
          <button type="submit">Lägg till fråga</button>
          <span id="formError" class="muted"></span>
        </div>
      </form>
    </section>

    <section id="lobby" class="hidden">
      <p class="muted">Scanna eller gå till <strong id="joinUrl"></strong> och ange koden</p>
      <div class="lobbyRow">
        <img id="qr" alt="QR-kod" width="240" height="240">
        <p id="code" class="code">––––</p>
      </div>
      <button id="startBtn">Starta första frågan</button>
    </section>

    <section id="question" class="hidden">
      <p id="qText"></p>
      <div id="chart"></div>
      <p id="answered" class="muted"></p>
      <button id="nextBtn">Visa resultat</button>
    </section>

    <section id="leaderboard" class="hidden">
      <h2 id="boardTitle">Topplista</h2>
      <ol id="board"></ol>
      <p id="over" class="hidden"><a href="/admin"><button>Ny omröstning</button></a></p>
    </section>
  </main>

  <aside id="sidebar" class="hidden">
    <h2>Elever <span id="playerCount" class="muted"></span></h2>
    <ul id="playerList"></ul>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const show = (...ids) => {
      for (const s of document.querySelectorAll("main > section")) s.classList.add("hidden");
      for (const id of ids) $(id).classList.remove("hidden");
    };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const renderBoard = (list) => {
      $("board").innerHTML = list.slice(0, 10).map((p) => `<li>${esc(p.name)} – ${p.score}</li>`).join("");
    };
    let code = null;
    let hostKey = null;
    let options = [];
    let qType = "choice";

    const saveSession = () => sessionStorage.setItem("samla-host", JSON.stringify({ code, hostKey }));
    const clearSession = () => { sessionStorage.removeItem("samla-host"); code = hostKey = null; };

    // Inloggad användare och utloggning
    fetch("/api/me").then((r) => (r.ok ? r.json() : Promise.reject())).then((me) => ($("me").textContent = me.email)).catch(() => location.replace("/login"));
    $("logoutBtn").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      clearSession();
      location.replace("/login");
    };

    // Staplar över svarsfördelningen, visas direkt och ritas om vid varje svar
    const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);
    const cls = (i, correct) => (correct === null || correct === undefined ? "" : i === correct ? "correct" : "wrong");

    // rows: [{ label, count, color }], correct: index i rows eller null
    function bars(rows, correct) {
      const total = rows.reduce((a, r) => a + r.count, 0);
      const max = Math.max(1, ...rows.map((r) => r.count));
      return `<div class="bars">${rows.map((r, i) => `
        <div class="bar ${cls(i, correct)}">
          <span class="label">${esc(r.label)}</span>
          <span class="track"><span class="fill ${r.color}" style="width:${(r.count / max) * 100}%"></span></span>
          <span class="count">${r.count} <small class="muted">${pct(r.count, total)}%</small></span>
        </div>`).join("")}</div>`;
    }

    // Klassiskt ordmoln: storlek efter antal, orden läggs ut längs en spiral från mitten
    // tills de får plats utan att överlappa. Ritas som inline-SVG, mäts med canvas.
    const measure = document.createElement("canvas").getContext("2d");
    function renderCloud(answers) {
      const W = 720, H = 400, PAD = 6;
      const words = answers.slice(0, 60);
      const counts = words.map((a) => a.count);
      const lo = Math.sqrt(Math.min(...counts)), hi = Math.sqrt(Math.max(...counts));
      const size = (c) => (hi === lo ? 40 : 18 + ((Math.sqrt(c) - lo) / (hi - lo)) * 50);
      const placed = [];
      const out = [];
      words.forEach((a, i) => {
        const fs = size(a.count);
        measure.font = `700 ${fs}px system-ui, sans-serif`;
        const w = measure.measureText(a.text).width + PAD * 2, h = fs * 1.15 + PAD;
        for (let t = 0; t < 4000; t++) {
          const ang = t * 0.12, rad = ang * 1.6;
          const cx = W / 2 + rad * Math.cos(ang), cy = H / 2 + rad * Math.sin(ang) * 0.65;
          const box = { x: cx - w / 2, y: cy - h / 2, w, h };
          if (box.x < 0 || box.y < 0 || box.x + w > W || box.y + h > H) continue;
          if (placed.some((p) => box.x < p.x + p.w && box.x + w > p.x && box.y < p.y + p.h && box.y + h > p.y)) continue;
          placed.push(box);
          out.push(`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" font-size="${fs.toFixed(1)}" class="w${i % 4}"><title>${esc(a.text)}: ${a.count}</title>${esc(a.text)}</text>`);
          break;
        }
      });
      // Vyn klipps till ordens utbredning så att molnet fyller ytan även med få svar
      const x0 = Math.min(...placed.map((p) => p.x)) - PAD, y0 = Math.min(...placed.map((p) => p.y)) - PAD;
      const x1 = Math.max(...placed.map((p) => p.x + p.w)) + PAD, y1 = Math.max(...placed.map((p) => p.y + p.h)) + PAD;
      return `<svg class="cloud" viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${(x1 - x0).toFixed(0)} ${(y1 - y0).toFixed(0)}" role="img" aria-label="Ordmoln över svaren">${out.join("")}</svg>`;
    }

    // Flerval: en stapel per alternativ (counts). Fritext: ordmoln över unika svar (answers) med antal under.
    function renderChart({ counts, answers } = {}, correct = null) {
      if (qType === "text") {
        const all = answers ?? [];
        $("chart").innerHTML = all.length
          ? renderCloud(all) + `<p class="cloudList muted">${all.slice(0, 10).map((a) => `${esc(a.text)} <b>×${a.count}</b>`).join(" · ")}${all.length > 10 ? ` · … ${all.length - 10} till` : ""}</p>`
          : `<p class="muted chartEmpty">Inga svar än</p>`;
      } else {
        $("chart").innerHTML = bars(options.map((o, i) => ({ label: o, count: counts?.[i] ?? 0, color: `c${i}` })), correct);
      }
    }

    $("createBtn").onclick = () => {
      socket.emit("host:create", (res) => {
        if (res.error) return ($("createError").textContent = res.error);
        code = res.code;
        hostKey = res.hostKey;
        saveSession();
        $("code").textContent = code;
        $("qr").src = `/qr/${code}`;
        $("joinUrl").textContent = location.host;
        $("sidebar").classList.remove("hidden");
        show("lobby");
      });
    };

    function renderLobby({ players }) {
      const online = players.filter((p) => p.connected).length;
      $("playerCount").textContent = `(${online})`;
      $("playerList").innerHTML = players.length
        ? players.map((p) => `<li class="${p.connected ? "" : "offline"}">${esc(p.name)}<span class="muted">${p.score}</span></li>`).join("")
        : `<li class="muted">Inga än</li>`;
    }
    socket.on("game:lobby", renderLobby);

    $("startBtn").onclick = () => socket.emit("host:start", { code });
    $("nextBtn").onclick = () => socket.emit("host:next", { code });

    function showQuestion({ index, total, type, text, options: opts }) {
      $("qText").textContent = `${index + 1}/${total}: ${text}`;
      options = opts;
      qType = type ?? "choice";
      renderChart({}, null);
      $("answered").textContent = "0 svar";
      $("nextBtn").textContent = "Visa resultat";
      show("question");
    }
    socket.on("game:question", showQuestion);

    function showResults({ counts, answers, correct, scored, leaderboard }) {
      renderChart({ counts, answers }, correct);
      $("nextBtn").textContent = "Nästa fråga";
      renderBoard(leaderboard);
      show("question", ...(scored ? ["leaderboard"] : []));
    }
    socket.on("game:results", showResults);

    // Efter sidladdning eller tappad förbindelse: ta tillbaka spelet och rita om läget
    socket.on("connect", () => {
      const saved = code ? { code, hostKey } : JSON.parse(sessionStorage.getItem("samla-host") ?? "null");
      if (!saved) return;
      socket.emit("host:resume", saved, (res) => {
        if (res.error) return clearSession();
        ({ code, hostKey } = saved);
        $("code").textContent = code;
        $("qr").src = `/qr/${code}`;
        $("joinUrl").textContent = location.host;
        $("sidebar").classList.remove("hidden");
        const st = res.state;
        renderLobby(st.lobby);
        if (st.phase === "lobby") return show("lobby");
        showQuestion(st.question);
        if (st.phase === "question") {
          $("answered").textContent = `${st.answered} av ${st.total} har svarat`;
          renderChart(st, null);
        } else {
          showResults(st);
        }
      });
    });

    socket.on("game:answered", ({ answered, total, counts, answers }) => {
      $("answered").textContent = `${answered} av ${total} har svarat`;
      if (counts || answers) renderChart({ counts, answers }, null);
    });

    socket.on("game:over", ({ scored, leaderboard }) => {
      clearSession();
      $("boardTitle").textContent = scored ? "Slutresultat" : "Omröstningen är slut";
      renderBoard(scored ? leaderboard : []);
      $("over").classList.remove("hidden");
      show("leaderboard");
    });

    async function loadQuestions() {
      const res = await fetch("/api/questions");
      if (res.status === 401) return location.replace("/login");
      const qs = await res.json();
      $("qCount").textContent = `(${qs.length})`;
      $("qList").innerHTML = qs.length ? qs.map((q, n) => `
        <li class="card qCard">
          <div class="qHead">
            <span class="qNum">${n + 1}</span>
            <strong class="qTitle">${esc(q.text)}</strong>
            <span class="tag ${q.correct === null ? "" : "scored"}">${q.type === "text" ? "Fritext" : q.correct === null ? "Omröstning" : "Rätt svar"}</span>
            <button class="small" data-del="${q.id}">Ta bort</button>
          </div>
          ${q.type === "text" ? `<p class="qOpts muted">Eleverna skriver ett svar på 1–3 ord</p>` : `<ol class="qOpts">${q.options.map((o, i) => `
            <li class="${i === q.correct ? "correct" : ""}"><span class="swatch c${i}"></span><span>${esc(o)}</span>${i === q.correct ? `<span class="check">✓ rätt</span>` : ""}</li>`).join("")}
          </ol>`}
        </li>`).join("") : `<li class="muted empty">Inga frågor än – lägg till en nedan.</li>`;
    }

    $("qList").onclick = async (e) => {
      const btn = e.target.closest("button[data-del]");
      if (!btn) return;
      await fetch(`/api/questions/${btn.dataset.del}`, { method: "DELETE" });
      loadQuestions();
    };

    // Fritext har inga alternativ: fältgruppen inaktiveras så att required inte stoppar formuläret
    function applyType() {
      const isText = $("qForm").type.value === "text";
      $("optsFieldset").disabled = isText;
      $("optsFieldset").classList.toggle("hidden", isText);
      $("textHint").classList.toggle("hidden", !isText);
    }
    $("qForm").addEventListener("change", (e) => { if (e.target.name === "type") applyType(); });
    $("qForm").addEventListener("reset", () => setTimeout(applyType));

    $("qForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const type = f.get("type");
      const options = type === "text" ? [] : ["o0", "o1", "o2", "o3"].map((k) => (f.get(k) ?? "").trim()).filter(Boolean);
      const correct = type === "text" || f.get("correct") === "" || f.get("correct") === null ? null : Number(f.get("correct"));
      const res = await fetch("/api/questions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, text: f.get("text"), options, correct }),
      });
      if (!res.ok) return ($("formError").textContent = (await res.json()).error);
      $("formError").textContent = "";
      e.target.reset();
      loadQuestions();
    };

    loadQuestions();
  </script>
</body>
</html>
