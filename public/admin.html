<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samla – admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
  <main>
    <h1>Samla <span class="muted">admin</span></h1>

    <section id="editor">
      <h2>Frågor</h2>
      <ol id="qList"></ol>
      <form id="qForm">
        <input name="text" placeholder="Fråga" required autocomplete="off">
        <label class="optRow noCorrect">
          <input type="radio" name="correct" value="" checked>
          <span class="muted">Inget rätt svar (åsiktsomröstning)</span>
        </label>
        <div class="optRow">
          <input type="radio" name="correct" value="0" title="Rätt svar">
          <input name="o0" placeholder="Alternativ 1" required autocomplete="off">
        </div>
        <div class="optRow">
          <input type="radio" name="correct" value="1" title="Rätt svar">
          <input name="o1" placeholder="Alternativ 2" required autocomplete="off">
        </div>
        <div class="optRow">
          <input type="radio" name="correct" value="2" title="Rätt svar">
          <input name="o2" placeholder="Alternativ 3 (valfritt)" autocomplete="off">
        </div>
        <div class="optRow">
          <input type="radio" name="correct" value="3" title="Rätt svar">
          <input name="o3" placeholder="Alternativ 4 (valfritt)" autocomplete="off">
        </div>
        <p class="muted">Markera radioknappen vid rätt svar om frågan har ett, annars blir det en ren omröstning.</p>
        <button type="submit">Lägg till fråga</button>
        <span id="formError" class="muted"></span>
      </form>
      <hr>
      <button id="createBtn">Starta omröstning</button>
      <span id="createError" class="muted"></span>
    </section>

    <section id="lobby" class="hidden">
      <p class="muted">Scanna eller gå till <strong id="joinUrl"></strong> och ange koden</p>
      <div class="lobbyRow">
        <img id="qr" alt="QR-kod" width="240" height="240">
        <p id="code" class="code">––––</p>
      </div>
      <button id="startBtn">Starta första frågan</button>
    </section>

    <section id="question" class="hidden">
      <p id="qText"></p>
      <div class="chartToggle">
        <button class="small" data-chart="bars">Staplar</button>
        <button class="small" data-chart="donut">Cirkel</button>
      </div>
      <div id="chart"></div>
      <p id="answered" class="muted"></p>
      <button id="nextBtn">Visa resultat</button>
    </section>

    <section id="leaderboard" class="hidden">
      <h2 id="boardTitle">Topplista</h2>
      <ol id="board"></ol>
      <p id="over" class="hidden"><a href="/admin"><button>Ny omröstning</button></a></p>
    </section>
  </main>

  <aside id="sidebar" class="hidden">
    <h2>Elever <span id="playerCount" class="muted"></span></h2>
    <ul id="playerList"></ul>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const show = (...ids) => {
      for (const s of document.querySelectorAll("main > section")) s.classList.add("hidden");
      for (const id of ids) $(id).classList.remove("hidden");
    };
    const renderBoard = (list) => {
      $("board").innerHTML = list.slice(0, 10).map((p) => `<li>${p.name} – ${p.score}</li>`).join("");
    };
    let code = null;
    let hostKey = null;
    let options = [];

    const saveSession = () => sessionStorage.setItem("samla-host", JSON.stringify({ code, hostKey }));
    const clearSession = () => { sessionStorage.removeItem("samla-host"); code = hostKey = null; };

    // Diagram: staplar eller cirkel (donut), båda ritas om vid varje svar
    let chartType = localStorage.getItem("samla-chart") ?? "bars";
    let lastCounts = [], lastCorrect = null;
    const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);
    const cls = (i, correct) => (correct === null || correct === undefined ? "" : i === correct ? "correct" : "wrong");

    function renderBars(counts, correct) {
      const total = counts.reduce((a, b) => a + b, 0);
      const max = Math.max(1, ...counts);
      return `<div class="bars">${options.map((o, i) => `
        <div class="bar ${cls(i, correct)}">
          <span class="label">${o}</span>
          <span class="track"><span class="fill c${i}" style="width:${(counts[i] / max) * 100}%"></span></span>
          <span class="count">${counts[i]} <small class="muted">${pct(counts[i], total)}%</small></span>
        </div>`).join("")}</div>`;
    }

    function renderDonut(counts, correct) {
      const total = counts.reduce((a, b) => a + b, 0);
      const R = 80, W = 30, C = 100;
      const point = (angle, r) => [C + r * Math.cos(angle), C + r * Math.sin(angle)];
      const segments = [];
      let start = -Math.PI / 2;
      counts.forEach((n, i) => {
        if (!n) return;
        const sweep = (n / total) * Math.PI * 2;
        const end = start + sweep;
        // Full cirkel går inte att rita som en båge, använd en ring
        if (n === total) {
          segments.push(`<circle cx="${C}" cy="${C}" r="${R}" fill="none" class="seg c${i} ${cls(i, correct)}" stroke-width="${W}"/>`);
        } else {
          const gap = 0.02; // liten lucka mellan segmenten
          const [x1, y1] = point(start + gap, R), [x2, y2] = point(end - gap, R);
          const large = sweep > Math.PI ? 1 : 0;
          segments.push(`<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2}" fill="none" class="seg c${i} ${cls(i, correct)}" stroke-width="${W}"/>`);
        }
        // Procent på segmentet om det är stort nog
        if (n / total >= 0.08) {
          const [lx, ly] = point(start + sweep / 2, R);
          segments.push(`<text x="${lx}" y="${ly}" class="segLabel">${pct(n, total)}%</text>`);
        }
        start = end;
      });
      const ring = total ? "" : `<circle cx="${C}" cy="${C}" r="${R}" fill="none" class="seg empty" stroke-width="${W}"/>`;
      return `<div class="donutWrap">
        <svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Svarsfördelning">
          ${ring}${segments.join("")}
          <text x="${C}" y="${C}" class="donutTotal">${total}</text>
          <text x="${C}" y="${C + 18}" class="donutSub">svar</text>
        </svg>
        <ul class="legend">${options.map((o, i) => `
          <li class="${cls(i, correct)}"><span class="swatch c${i}"></span><span class="label">${o}</span><span class="count">${counts[i]} <small class="muted">${pct(counts[i], total)}%</small></span></li>`).join("")}
        </ul>
      </div>`;
    }

    function renderChart(counts = lastCounts, correct = lastCorrect) {
      lastCounts = counts; lastCorrect = correct;
      $("chart").innerHTML = chartType === "donut" ? renderDonut(counts, correct) : renderBars(counts, correct);
      for (const b of document.querySelectorAll("[data-chart]")) b.classList.toggle("active", b.dataset.chart === chartType);
    }
    document.querySelector(".chartToggle").onclick = (e) => {
      const b = e.target.closest("[data-chart]");
      if (!b) return;
      chartType = b.dataset.chart;
      localStorage.setItem("samla-chart", chartType);
      renderChart();
    };

    $("createBtn").onclick = () => {
      socket.emit("host:create", (res) => {
        if (res.error) return ($("createError").textContent = res.error);
        code = res.code;
        hostKey = res.hostKey;
        saveSession();
        $("code").textContent = code;
        $("qr").src = `/qr/${code}`;
        $("joinUrl").textContent = location.host;
        $("sidebar").classList.remove("hidden");
        show("lobby");
      });
    };

    function renderLobby({ players }) {
      const online = players.filter((p) => p.connected).length;
      $("playerCount").textContent = `(${online})`;
      $("playerList").innerHTML = players.length
        ? players.map((p) => `<li class="${p.connected ? "" : "offline"}">${p.name}<span class="muted">${p.score}</span></li>`).join("")
        : `<li class="muted">Inga än</li>`;
    }
    socket.on("game:lobby", renderLobby);

    $("startBtn").onclick = () => socket.emit("host:start", { code });
    $("nextBtn").onclick = () => socket.emit("host:next", { code });

    function showQuestion({ index, total, text, options: opts }) {
      $("qText").textContent = `${index + 1}/${total}: ${text}`;
      options = opts;
      renderChart(options.map(() => 0), null);
      $("answered").textContent = "0 svar";
      $("nextBtn").textContent = "Visa resultat";
      show("question");
    }
    socket.on("game:question", showQuestion);

    function showResults({ counts, correct, scored, leaderboard }) {
      renderChart(counts, correct);
      $("nextBtn").textContent = "Nästa fråga";
      renderBoard(leaderboard);
      show("question", ...(scored ? ["leaderboard"] : []));
    }
    socket.on("game:results", showResults);

    // Efter sidladdning eller tappad förbindelse: ta tillbaka spelet och rita om läget
    socket.on("connect", () => {
      const saved = code ? { code, hostKey } : JSON.parse(sessionStorage.getItem("samla-host") ?? "null");
      if (!saved) return;
      socket.emit("host:resume", saved, (res) => {
        if (res.error) return clearSession();
        ({ code, hostKey } = saved);
        $("code").textContent = code;
        $("qr").src = `/qr/${code}`;
        $("joinUrl").textContent = location.host;
        $("sidebar").classList.remove("hidden");
        const st = res.state;
        renderLobby(st.lobby);
        if (st.phase === "lobby") return show("lobby");
        showQuestion(st.question);
        if (st.phase === "question") {
          $("answered").textContent = `${st.answered} av ${st.total} har svarat`;
          renderChart(st.counts, null);
        } else {
          showResults(st);
        }
      });
    });

    socket.on("game:answered", ({ answered, total, counts }) => {
      $("answered").textContent = `${answered} av ${total} har svarat`;
      if (counts) renderChart(counts, null);
    });

    socket.on("game:over", ({ scored, leaderboard }) => {
      clearSession();
      $("boardTitle").textContent = scored ? "Slutresultat" : "Omröstningen är slut";
      renderBoard(scored ? leaderboard : []);
      $("over").classList.remove("hidden");
      show("leaderboard");
    });

    async function loadQuestions() {
      const qs = await (await fetch("/api/questions")).json();
      $("qList").innerHTML = qs.map((q) => `
        <li>
          <strong>${q.text}</strong>
          <span class="muted">${q.options.map((o, i) => i === q.correct ? `<u>${o}</u>` : o).join(" · ")}${q.correct === null ? " · <em>omröstning</em>" : ""}</span>
          <button class="small" data-del="${q.id}">Ta bort</button>
        </li>`).join("");
    }

    $("qList").onclick = async (e) => {
      const btn = e.target.closest("button[data-del]");
      if (!btn) return;
      await fetch(`/api/questions/${btn.dataset.del}`, { method: "DELETE" });
      loadQuestions();
    };

    $("qForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const options = ["o0", "o1", "o2", "o3"].map((k) => f.get(k).trim()).filter(Boolean);
      const res = await fetch("/api/questions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: f.get("text"), options, correct: f.get("correct") === "" ? null : Number(f.get("correct")) }),
      });
      if (!res.ok) return ($("formError").textContent = (await res.json()).error);
      $("formError").textContent = "";
      e.target.reset();
      loadQuestions();
    };

    loadQuestions();
  </script>
</body>
</html>
