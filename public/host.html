<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samla – värd</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Samla <span class="muted">värd</span></h1>

    <section id="lobby">
      <p class="muted">Gå till <strong>samla.spinnrock.com</strong> och ange koden</p>
      <p id="code" class="code">––––</p>
      <p id="players" class="muted">Inga spelare än</p>
      <button id="startBtn">Starta spelet</button>
    </section>

    <section id="question" class="hidden">
      <p id="qText"></p>
      <div id="options" class="options"></div>
      <p id="answered" class="muted"></p>
      <button id="nextBtn">Nästa</button>
    </section>

    <section id="leaderboard" class="hidden">
      <h2 id="boardTitle">Topplista</h2>
      <ol id="board"></ol>
      <p id="over" class="hidden"><a href="/host.html"><button>Nytt spel</button></a></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const show = (...ids) => {
      for (const s of document.querySelectorAll("section")) s.classList.add("hidden");
      for (const id of ids) $(id).classList.remove("hidden");
    };
    const renderBoard = (list) => {
      $("board").innerHTML = list.slice(0, 10).map((p) => `<li>${p.name} – ${p.score}</li>`).join("");
    };
    let code = null;

    socket.emit("host:create", (res) => {
      code = res.code;
      $("code").textContent = code;
    });

    socket.on("game:lobby", ({ players }) => {
      $("players").textContent = players.length
        ? `${players.length} spelare: ${players.join(", ")}`
        : "Inga spelare än";
    });

    $("startBtn").onclick = () => socket.emit("host:start", { code });

    socket.on("game:question", ({ index, total, text, options }) => {
      $("qText").textContent = `${index + 1}/${total}: ${text}`;
      $("options").innerHTML = options.map((o) => `<button disabled>${o}</button>`).join("");
      $("answered").textContent = "0 svar";
      show("question");
    });

    socket.on("game:answered", ({ answered, total }) => {
      $("answered").textContent = `${answered} av ${total} har svarat`;
    });

    $("nextBtn").onclick = () => socket.emit("host:next", { code });

    socket.on("game:results", ({ counts, correct, leaderboard }) => {
      const btns = $("options").querySelectorAll("button");
      btns.forEach((b, i) => {
        b.textContent = `${b.textContent} (${counts[i]})`;
        b.style.opacity = i === correct ? "1" : "0.35";
        if (i === correct) b.style.outline = "4px solid var(--fg)";
      });
      renderBoard(leaderboard);
      show("question", "leaderboard");
    });

    socket.on("game:over", ({ leaderboard }) => {
      $("boardTitle").textContent = "Slutresultat";
      renderBoard(leaderboard);
      $("over").classList.remove("hidden");
      show("leaderboard");
    });
  </script>
</body>
</html>
